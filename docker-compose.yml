services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: PRReviewerAssignment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aidar2006
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  pr-reviewer-assignment-service:
    build: ./pr-reviewer-assignment-service
    environment:
      DATABASE_URL: postgres://postgres:aidar2006@localhost:5432/PRReviewerAssignment?sslmode=disable
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: